<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>Universal AI Chat</title>

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Dark Mode Config for Tailwind -->
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            geminiBg: '#f8fafd',
            geminiDarkBg: '#131314',
            geminiSidebar: '#f0f4f9',
            geminiDarkSidebar: '#1e1f20',
            geminiCard: '#ffffff',
            geminiDarkCard: '#282a2c'
          }
        }
      }
    }
  </script>

  <!-- Marked.js CDN for Markdown -->
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <style>
    /* Prevent unwanted layout scroll bugs on mobile iOS/Android */
    html, body {
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
    }
    
    /* Code block styling */
    pre {
      background-color: #1e1e1e;
      color: #d4d4d4;
      padding: 1rem;
      border-radius: 0.5rem;
      overflow-x: auto;
      margin-top: 0.5rem;
      margin-bottom: 0.5rem;
      font-size: 0.875rem;
    }
    code {
      font-family: monospace;
    }
    p {
      margin-bottom: 0.5rem;
    }
    p:last-child {
      margin-bottom: 0;
    }
    
    /* Blinking Cursor for Typing Animation */
    .typing-cursor::after {
      content: '▋';
      display: inline-block;
      animation: blink 1s infinite;
      margin-left: 2px;
      color: #3b82f6;
    }
    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0; }
    }
  </style>
</head>

<body class="bg-geminiBg dark:bg-geminiDarkBg text-gray-800 dark:text-gray-200 antialiased h-full">

  <!-- FALLBACK LOADING SCREEN -->
  <div id="loading" class="fixed inset-0 z-50 flex items-center justify-center bg-white dark:bg-gray-900 text-gray-700 dark:text-gray-200 text-lg font-medium">
    <div class="flex items-center space-x-3">
      <svg class="animate-spin h-6 w-6 text-blue-600" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
        <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
        <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
      </svg>
      <span>Initializing AI Chat...</span>
    </div>
  </div>

  <!-- MAIN APPLICATION WRAPPER -->
  <div id="app" class="hidden h-full flex flex-col md:flex-row overflow-hidden relative">

    <!-- MOBILE OVERLAY BACKDROP -->
    <div id="sidebar-backdrop" onclick="toggleSidebar(false)" class="fixed inset-0 bg-black/50 z-20 hidden md:hidden"></div>

    <!-- SIDEBAR -->
    <aside id="sidebar" class="fixed md:static inset-y-0 left-0 z-30 w-72 bg-geminiSidebar dark:bg-geminiDarkSidebar flex flex-col transition-transform duration-300 ease-in-out -translate-x-full md:translate-x-0 border-r border-gray-200 dark:border-gray-800">
      
      <!-- Top Action Bar -->
      <div class="p-4 flex items-center justify-between">
        <button onclick="createNewChat()" class="flex-1 flex items-center space-x-3 px-4 py-3 bg-white dark:bg-geminiDarkCard hover:bg-gray-100 dark:hover:bg-gray-700 rounded-full shadow-sm border border-gray-200 dark:border-gray-700 transition">
          <i data-lucide="plus" class="w-5 h-5 text-gray-600 dark:text-gray-300"></i>
          <span class="font-medium text-sm text-gray-700 dark:text-gray-200">New Chat</span>
        </button>
        <button onclick="toggleSidebar(false)" class="md:hidden p-2 text-gray-500 hover:text-gray-700 dark:text-gray-400 dark:hover:text-gray-200 ml-2">
          <i data-lucide="x" class="w-6 h-6"></i>
        </button>
      </div>

      <!-- Chat History List -->
      <div class="flex-1 overflow-y-auto px-3 py-2 space-y-1" id="chat-list">
        <!-- Rendered dynamically -->
      </div>

      <!-- Sidebar Footer / Settings -->
      <div class="p-3 border-t border-gray-200 dark:border-gray-800 space-y-1">
        <button onclick="openModal('settings-modal')" class="w-full flex items-center space-x-3 px-3 py-2.5 rounded-lg hover:bg-gray-200 dark:hover:bg-gray-800 transition text-sm">
          <i data-lucide="settings" class="w-5 h-5 text-gray-600 dark:text-gray-400"></i>
          <span>Settings</span>
        </button>
        <button onclick="toggleDarkMode()" class="w-full flex items-center space-x-3 px-3 py-2.5 rounded-lg hover:bg-gray-200 dark:hover:bg-gray-800 transition text-sm">
          <i id="theme-icon" data-lucide="moon" class="w-5 h-5 text-gray-600 dark:text-gray-400"></i>
          <span id="theme-text">Dark Mode</span>
        </button>
      </div>
    </aside>

    <!-- MAIN CHAT AREA -->
    <main class="flex-1 flex flex-col h-full min-w-0 bg-geminiBg dark:bg-geminiDarkBg relative">

      <!-- Header -->
      <header class="h-14 border-b border-gray-200 dark:border-gray-800 flex items-center justify-between px-4 bg-geminiBg/80 dark:bg-geminiDarkBg/80 backdrop-blur shrink-0 z-10">
        <div class="flex items-center space-x-3 min-w-0">
          <button onclick="toggleSidebar(true)" class="md:hidden p-2 text-gray-600 dark:text-gray-300 rounded-lg hover:bg-gray-200 dark:hover:bg-gray-800">
            <i data-lucide="menu" class="w-6 h-6"></i>
          </button>
          <span id="current-chat-title" class="font-semibold text-gray-800 dark:text-gray-100 truncate">New Conversation</span>
        </div>
        
        <div class="flex items-center space-x-2">
          <button onclick="openModal('system-prompt-modal')" title="System Prompt" class="p-2 text-gray-600 dark:text-gray-400 hover:bg-gray-200 dark:hover:bg-gray-800 rounded-lg">
            <i data-lucide="sliders" class="w-5 h-5"></i>
          </button>
        </div>
      </header>

      <!-- Message Container (Scrollable) -->
      <div id="messages-container" class="flex-1 overflow-y-auto p-4 md:p-6 space-y-6">
        <!-- Messages rendered dynamically -->
      </div>

      <!-- INPUT BAR AREA (Sticky at bottom, Mobile Safe) -->
      <div class="p-3 md:p-4 bg-geminiBg dark:bg-geminiDarkBg border-t border-gray-200/50 dark:border-gray-800/50 shrink-0">
        <div class="max-w-4xl mx-auto relative">
          <form id="chat-form" onsubmit="handleSend(event)" class="relative flex items-end bg-white dark:bg-geminiDarkCard rounded-2xl shadow-sm border border-gray-200 dark:border-gray-700 focus-within:ring-2 focus-within:ring-blue-500/50 focus-within:border-blue-500 transition-all">
            
            <textarea
              id="user-input"
              rows="1"
              placeholder="Ask anything..."
              class="w-full resize-none bg-transparent py-3.5 pl-4 pr-12 text-sm md:text-base text-gray-800 dark:text-gray-100 placeholder-gray-400 focus:outline-none max-h-36 overflow-y-auto"
              onkeydown="handleKeyDown(event)"
              oninput="autoResizeTextarea(this)"
            ></textarea>

            <button type="submit" id="send-btn" class="absolute right-2 bottom-2 p-2 bg-blue-600 hover:bg-blue-700 text-white rounded-xl disabled:opacity-40 disabled:hover:bg-blue-600 transition">
              <i data-lucide="send" class="w-5 h-5"></i>
            </button>
          </form>
          <div class="text-[11px] text-center text-gray-400 dark:text-gray-500 mt-2 truncate">
            Powered by OpenRouter API • Model: <span id="active-model-display" class="font-mono">deepseek/deepseek-r1:free</span>
          </div>
        </div>
      </div>
    </main>
  </div>

  <!-- SETTINGS MODAL -->
  <div id="settings-modal" class="fixed inset-0 z-50 bg-black/60 hidden flex items-center justify-center p-4">
    <div class="bg-white dark:bg-geminiDarkCard w-full max-w-md rounded-2xl p-6 shadow-xl border border-gray-200 dark:border-gray-700">
      <div class="flex items-center justify-between mb-4">
        <h3 class="text-lg font-bold text-gray-900 dark:text-gray-100">API Settings</h3>
        <button onclick="closeModal('settings-modal')" class="text-gray-400 hover:text-gray-600 dark:hover:text-gray-200">
          <i data-lucide="x" class="w-5 h-5"></i>
        </button>
      </div>
      
      <div class="space-y-4">
        <div>
          <label class="block text-xs font-semibold text-gray-600 dark:text-gray-400 uppercase tracking-wider mb-1">OpenRouter API Key</label>
          <input type="password" id="setting-api-key" placeholder="sk-or-v1-..." class="w-full px-3 py-2 bg-gray-50 dark:bg-gray-800 border border-gray-300 dark:border-gray-700 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 text-sm" />
        </div>
        
        <div>
          <label class="block text-xs font-semibold text-gray-600 dark:text-gray-400 uppercase tracking-wider mb-1">Model Name</label>
          <input type="text" id="setting-model" placeholder="deepseek/deepseek-r1:free" class="w-full px-3 py-2 bg-gray-50 dark:bg-gray-800 border border-gray-300 dark:border-gray-700 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 text-sm" />
        </div>
      </div>

      <div class="mt-6 flex justify-end space-x-2">
        <button onclick="closeModal('settings-modal')" class="px-4 py-2 text-sm text-gray-600 dark:text-gray-400 hover:bg-gray-100 dark:hover:bg-gray-800 rounded-lg">Cancel</button>
        <button onclick="saveSettings()" class="px-4 py-2 text-sm bg-blue-600 hover:bg-blue-700 text-white rounded-lg">Save Changes</button>
      </div>
    </div>
  </div>

  <!-- SYSTEM PROMPT MODAL -->
  <div id="system-prompt-modal" class="fixed inset-0 z-50 bg-black/60 hidden flex items-center justify-center p-4">
    <div class="bg-white dark:bg-geminiDarkCard w-full max-w-md rounded-2xl p-6 shadow-xl border border-gray-200 dark:border-gray-700">
      <div class="flex items-center justify-between mb-4">
        <h3 class="text-lg font-bold text-gray-900 dark:text-gray-100">System Prompt</h3>
        <button onclick="closeModal('system-prompt-modal')" class="text-gray-400 hover:text-gray-600 dark:hover:text-gray-200">
          <i data-lucide="x" class="w-5 h-5"></i>
        </button>
      </div>
      
      <div>
        <label class="block text-xs font-semibold text-gray-600 dark:text-gray-400 uppercase tracking-wider mb-1">Set Assistant Persona / Instructions</label>
        <textarea id="system-prompt-input" rows="5" placeholder="You are a helpful, expert AI assistant..." class="w-full px-3 py-2 bg-gray-50 dark:bg-gray-800 border border-gray-300 dark:border-gray-700 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 text-sm resize-none"></textarea>
      </div>

      <div class="mt-6 flex justify-end space-x-2">
        <button onclick="closeModal('system-prompt-modal')" class="px-4 py-2 text-sm text-gray-600 dark:text-gray-400 hover:bg-gray-100 dark:hover:bg-gray-800 rounded-lg">Cancel</button>
        <button onclick="saveSystemPrompt()" class="px-4 py-2 text-sm bg-blue-600 hover:bg-blue-700 text-white rounded-lg">Save System Prompt</button>
      </div>
    </div>
  </div>


  <!-- SCRIPT AT VERY END OF BODY -->
  <script>
    // Global Application State
    const STATE = {
      apiKey: '',
      model: 'deepseek/deepseek-r1:free',
      chats: [],
      activeChatId: null,
      isDarkMode: false,
      isGenerating: false
    };

    // Initialize Application
    window.addEventListener('DOMContentLoaded', () => {
      try {
        loadLocalStorage();
        initDarkMode();
        
        if (!STATE.chats || STATE.chats.length === 0) {
          createNewChat(false);
        } else if (!STATE.activeChatId || !STATE.chats.find(c => c.id === STATE.activeChatId)) {
          STATE.activeChatId = STATE.chats[0].id;
        }

        renderApp();
      } catch (err) {
        console.error("Initialization Error:", err);
      } finally {
        // Hide loader safely
        const loader = document.getElementById('loading');
        const app = document.getElementById('app');
        if (loader) loader.classList.add('hidden');
        if (app) app.classList.remove('hidden');
        lucide.createIcons();
      }
    });

    // --- LOCAL STORAGE HANDLING ---
    function loadLocalStorage() {
      STATE.apiKey = localStorage.getItem('ai_chat_api_key') || '';
      STATE.model = localStorage.getItem('ai_chat_model') || 'deepseek/deepseek-r1:free';
      STATE.isDarkMode = localStorage.getItem('ai_chat_theme') === 'dark';
      
      try {
        const savedChats = localStorage.getItem('ai_chat_history');
        STATE.chats = savedChats ? JSON.parse(savedChats) : [];
        STATE.activeChatId = localStorage.getItem('ai_chat_active_id');
      } catch (e) {
        console.error("Failed to parse local chat history:", e);
        STATE.chats = [];
      }
    }

    function saveLocalStorage() {
      localStorage.setItem('ai_chat_api_key', STATE.apiKey);
      localStorage.setItem('ai_chat_model', STATE.model);
      localStorage.setItem('ai_chat_theme', STATE.isDarkMode ? 'dark' : 'light');
      localStorage.setItem('ai_chat_history', JSON.stringify(STATE.chats));
      if (STATE.activeChatId) {
        localStorage.setItem('ai_chat_active_id', STATE.activeChatId);
      }
    }

    // --- DARK MODE ---
    function initDarkMode() {
      if (STATE.isDarkMode) {
        document.documentElement.classList.add('dark');
      } else {
        document.documentElement.classList.remove('dark');
      }
      updateThemeUI();
    }

    function toggleDarkMode() {
      STATE.isDarkMode = !STATE.isDarkMode;
      initDarkMode();
      saveLocalStorage();
    }

    function updateThemeUI() {
      const icon = document.getElementById('theme-icon');
      const text = document.getElementById('theme-text');
      if (icon && text) {
        if (STATE.isDarkMode) {
          icon.setAttribute('data-lucide', 'sun');
          text.textContent = 'Light Mode';
        } else {
          icon.setAttribute('data-lucide', 'moon');
          text.textContent = 'Dark Mode';
        }
        lucide.createIcons();
      }
    }

    // --- RENDER FUNCTIONS ---
    function renderApp() {
      renderChatList();
      renderMessages();
      updateHeader();
      
      // Update Inputs
      const apiKeyInput = document.getElementById('setting-api-key');
      const modelInput = document.getElementById('setting-model');
      const modelDisplay = document.getElementById('active-model-display');
      
      if (apiKeyInput) apiKeyInput.value = STATE.apiKey;
      if (modelInput) modelInput.value = STATE.model;
      if (modelDisplay) modelDisplay.textContent = STATE.model || 'Not Configured';
    }

    function getActiveChat() {
      return STATE.chats.find(c => c.id === STATE.activeChatId) || null;
    }

    function updateHeader() {
      const activeChat = getActiveChat();
      const titleEl = document.getElementById('current-chat-title');
      if (titleEl) {
        titleEl.textContent = activeChat ? activeChat.title : 'New Conversation';
      }
    }

    function renderChatList() {
      const container = document.getElementById('chat-list');
      if (!container) return;
      
      container.innerHTML = '';

      STATE.chats.forEach(chat => {
        const isActive = chat.id === STATE.activeChatId;
        const item = document.createElement('div');
        item.className = `group flex items-center justify-between px-3 py-2.5 rounded-xl cursor-pointer text-sm transition ${
          isActive 
            ? 'bg-blue-100/70 dark:bg-blue-950/40 text-blue-700 dark:text-blue-300 font-medium' 
            : 'hover:bg-gray-200/60 dark:hover:bg-gray-800/60 text-gray-700 dark:text-gray-300'
        }`;

        item.onclick = () => switchChat(chat.id);

        item.innerHTML = `
          <div class="flex items-center space-x-2.5 truncate min-w-0 pr-1">
            <i data-lucide="message-square" class="w-4 h-4 shrink-0"></i>
            <span class="truncate">${escapeHtml(chat.title)}</span>
          </div>
          <div class="flex items-center space-x-1 opacity-0 group-hover:opacity-100 transition shrink-0">
            <button onclick="event.stopPropagation(); renameChatPrompt('${chat.id}')" class="p-1 hover:text-blue-600 rounded">
              <i data-lucide="edit-2" class="w-3.5 h-3.5"></i>
            </button>
            <button onclick="event.stopPropagation(); deleteChat('${chat.id}')" class="p-1 hover:text-red-600 rounded">
              <i data-lucide="trash-2" class="w-3.5 h-3.5"></i>
            </button>
          </div>
        `;
        container.appendChild(item);
      });

      lucide.createIcons();
    }

    function renderMessages() {
      const container = document.getElementById('messages-container');
      if (!container) return;
      container.innerHTML = '';

      const activeChat = getActiveChat();
      if (!activeChat || activeChat.messages.length === 0) {
        container.innerHTML = `
          <div class="h-full flex flex-col items-center justify-center text-center p-6 text-gray-400">
            <div class="w-12 h-12 rounded-2xl bg-blue-100 dark:bg-blue-900/30 text-blue-600 dark:text-blue-400 flex items-center justify-center mb-4">
              <i data-lucide="bot" class="w-6 h-6"></i>
            </div>
            <h2 class="text-xl font-medium text-gray-700 dark:text-gray-200 mb-1">How can I help you today?</h2>
            <p class="text-xs text-gray-400 max-w-sm">Make sure to add your OpenRouter API key in Settings before sending a message.</p>
          </div>
        `;
        lucide.createIcons();
        return;
      }

      activeChat.messages.forEach(msg => {
        const msgWrapper = document.createElement('div');
        msgWrapper.className = `flex ${msg.role === 'user' ? 'justify-end' : 'justify-start'} w-full`;

        const isUser = msg.role === 'user';
        const parsedContent = isUser ? escapeHtml(msg.content) : marked.parse(msg.content || '');

        msgWrapper.innerHTML = `
          <div class="flex space-x-3 max-w-3xl ${isUser ? 'flex-row-reverse space-x-reverse' : 'flex-row'}">
            <div class="w-8 h-8 rounded-full flex items-center justify-center shrink-0 ${
              isUser 
                ? 'bg-blue-600 text-white' 
                : 'bg-emerald-600 text-white'
            }">
              <i data-lucide="${isUser ? 'user' : 'bot'}" class="w-4 h-4"></i>
            </div>
            <div class="px-4 py-3 rounded-2xl text-sm leading-relaxed ${
              isUser 
                ? 'bg-blue-600 text-white rounded-tr-none' 
                : 'bg-white dark:bg-geminiDarkCard border border-gray-200 dark:border-gray-700/60 rounded-tl-none shadow-sm'
            }">
              <div class="prose dark:prose-invert max-w-none">${parsedContent}</div>
            </div>
          </div>
        `;
        container.appendChild(msgWrapper);
      });

      lucide.createIcons();
      scrollToBottom();
    }

    // --- CHAT ACTIONS ---
    function createNewChat(switchToIt = true) {
      const newChat = {
        id: 'chat_' + Date.now(),
        title: 'New Conversation',
        systemPrompt: '',
        messages: []
      };
      
      STATE.chats.unshift(newChat);
      if (switchToIt) {
        STATE.activeChatId = newChat.id;
        toggleSidebar(false);
      }
      
      saveLocalStorage();
      renderApp();
    }

    function switchChat(id) {
      STATE.activeChatId = id;
      saveLocalStorage();
      renderApp();
      toggleSidebar(false);
    }

    function deleteChat(id) {
      STATE.chats = STATE.chats.filter(c => c.id !== id);
      if (STATE.activeChatId === id) {
        STATE.activeChatId = STATE.chats.length > 0 ? STATE.chats[0].i
